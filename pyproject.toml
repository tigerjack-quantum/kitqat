[project]
name = "qatext"
version = "1.13.10"
description = "Extensions and utilities to QAT"
authors = [
    {name = "Simone Perriello"}
]
license = { text = "AGPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # "myqlm", # can't add it as a dependency, bcz it conflics when installed on QLM
    "qat-comm>=1.4.0",
    "qat-core>=1.6",
    "qat-lang>=2.2.0",
    "typing",
    "numpy>=1.15",
    "bitarray>=3.0.0",
]

[project.optional-dependencies]
myqlm = [
    "myqlm"
]
    
dev = [
    "black",
    "mypy",
    "isort",
    "pylint",
    "flake8",
    "autoflake",
]
test = [
    "pytest",
    "sympy",
     "parameterized",
]

jupyter = [
    "jupyter",
    "ipython",
    "matplotlib",
    "seaborn",
]

[project.urls]
# homepage = "https://github.com/tigerjack/qat-utils"
repository = "https://github.com/tigerjack/qat-utils"
# documentation = "https://your-docs-url.com"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = true
include = ["LICENSE", "qatext"]

[tool.poetry.scripts]
qat-utils = "qat_utils.cli:main"


[tool.mypy]
strict = true

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
( 
  .*_pb2.py  # exclude autogenerated Protocol Buffer files anywhere in the project
  | __pycache__  # exclude compiled Python files
)
preview = false  # Stable formatting style across releases
'''

[tool.pyright]
exclude = [
        "**/__pycache__"
    ]
reportMissingImports = "error"
reportMissingTypeStubs = "none"
pythonVersion = "3.12"
