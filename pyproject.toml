[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["qat"]

[tool.pyright]
exclude = [
        "**/__pycache__"
    ]
reportMissingImports = "error"
reportMissingTypeStubs = "none"
venvPath = "/mnt/internal/LinuxData/pyenv/versions"
venv = "myqlm11"
pythonVersion = "3.11"

[project]
name = "qat-utils"
version="1.9.6"
description = "Some useful extension to Atos Qat language"
# license = "Proprietary"
# repository="https://github.com/tigerjack/qat-utils "
authors=[ {name = "Simone Perriello", email = "sperriello@proton.me"} ]
readme = "README.md"
requires-python = ">=3.9"
keywords = ["qat", "atos", "quantum", "qlm"]
# license = {text = "BSD 3-Clause License"}
classifiers = [
        "Environment :: Console",
        "Intended Audience :: Developers",
        "Intended Audience :: Science/Research",
        "Operating System :: Microsoft :: Windows",
        "Operating System :: MacOS",
        "Operating System :: POSIX :: Linux",
        "Programming Language :: Python :: 3.9",
        "Topic :: Scientific/Engineering",
]
dependencies = [
    "qat-comm",
    "qat-core",
    "qat-lang",
    "typing",
    "numpy>=1.15",
    "bitarray",
]
# dynamic = ["version"]


[project.optional-dependencies]
dev = [
    "tox",
    "pre-commit",
    "bump2version"
]
test = [
     "pytest",
     "parameterized"
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
# 'extend-exclude' excludes files or directories in addition to the defaults
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
(
  ^/foo.py    # exclude a file named foo.py in the root of the project
  | .*_pb2.py  # exclude autogenerated Protocol Buffer files anywhere in the project
)
'''

# We use preview style for formatting Black itself. If you
# want stable formatting across releases, you should keep
# this off.
preview = true
